spring:
  application:
    name: rfq-service
  profiles:
    default: local
  lifecycle:
    timeout-per-shutdown-phase: 30s
  servlet:
    multipart:
      max-file-size: 30MB
      # Migration may contain both a 30 MB original and a 30 MB reviewed file.
      max-request-size: 64MB

office:
  public-url: ${ONLYOFFICE_PUBLIC_URL:http://127.0.0.1:8082}
  internal-url: ${ONLYOFFICE_INTERNAL_URL:http://onlyoffice}
  callback-base-url: ${ONLYOFFICE_CALLBACK_BASE_URL:http://rfq-service:48081}
  jwt-secret: ${ONLYOFFICE_JWT_SECRET:}
  storage-dir: ${ONLYOFFICE_STORAGE_DIR:data/onlyoffice}
  max-file-bytes: 31457280
  frontend-origins: ${ONLYOFFICE_FRONTEND_ORIGINS:http://127.0.0.1:5173,http://localhost:5173}

server:
  port: ${SERVER_PORT:48081}
  shutdown: graceful
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      show-components: never
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    description: RFQ 独立后端框架
