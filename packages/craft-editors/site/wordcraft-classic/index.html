<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>WordCraft</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #e6e6e6; }
    #wordcraft_canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #wordcraft_loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #555; font: 14px system-ui, sans-serif; pointer-events: none; }
  </style>
<link rel="icon" href="data:,">
<script type="module">
try {
  const {default:init}=await import('./wordcraft-classic.js');
  await init({module_or_path:'./wordcraft-classic_bg.wasm'});
} catch(cause) {
  const error=cause instanceof Error?cause.message:String(cause);
  const loading=document.getElementById('wordcraft_loading');
  if(loading)loading.textContent='Word 编辑器启动失败：'+error;
  if(window.parent!==window&&new URLSearchParams(window.location.search).get('host')==='parent')
    window.parent.postMessage({type:'wordcraft:failed',error},window.location.origin);
}
</script>
</head>
<body>
  <canvas id="wordcraft_canvas"></canvas>
  <div id="wordcraft_loading">Loading WordCraft&hellip;</div>
</body>
</html>
