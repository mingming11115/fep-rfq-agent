<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PdfCraft</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #f1f1f3; }
      canvas { width: 100%; height: 100%; display: block; outline: none; }
      @media (prefers-color-scheme: dark) { html, body { background: #19191c; } }
    </style>
  <link rel="icon" href="data:,">
<script type="module">
try {
  const {default:init}=await import('./pdfcraft-classic.js');
  await init({module_or_path:'./pdfcraft-classic_bg.wasm'});
} catch(cause) {
  console.error('启动 PDF 编辑器失败', cause);
  const error=cause instanceof Error?cause.message:String(cause);
  const loading=document.getElementById('pdfcraft_error');
  if(loading) { loading.textContent='PDF 编辑器启动失败：'+error; loading.hidden=false; }
  if(window.parent!==window&&new URLSearchParams(window.location.search).get('host')==='parent') {
    window.parent.postMessage({type:'pdfcraft:failed',error},window.location.origin);
  }
}
</script>
</head>
  <body>
    <canvas id="pdfcraft"></canvas>
    <div id="pdfcraft_error" hidden style="position:absolute;top:20px;left:20px;right:20px;padding:16px;background:white;color:#a00;font:14px system-ui"></div>
  </body>
</html>
