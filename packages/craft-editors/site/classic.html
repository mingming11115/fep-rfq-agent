<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Word / PDF 统一批注 · 批阅 Demo</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/word-comments.css">
  <link rel="stylesheet" href="/original-comments.css">
  <style>
    *{box-sizing:border-box}html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172e4a;background:#f4f6fa}body{display:flex;flex-direction:column}header{display:flex;align-items:center;gap:24px;min-height:62px;padding:10px 22px;border-bottom:1px solid #dae2ec;background:white}h1{font-size:17px;margin:0;white-space:nowrap}.tabs{display:flex;gap:5px;padding:4px;background:#f0f3f8;border-radius:9px}.tabs a{font-size:14px;text-decoration:none;border-radius:6px;padding:8px 18px;color:#52637c}.tabs a[aria-current=page]{background:#204c8e;color:white;box-shadow:0 2px 5px #204c8e25}.version{margin-left:auto;font-size:12px;color:#6e7d91}.toolbar{display:flex;align-items:center;flex-wrap:wrap;gap:9px 14px;padding:11px 22px;background:#fafbfd;border-bottom:1px solid #dae2ec;font-size:13px}.filename{font-weight:600}#status{color:#687991;min-width:100px}.actions{margin-left:auto;display:flex;align-items:center;gap:9px}button,.actions a{font:inherit;color:#204c8e;border:1px solid #c8d4e5;background:white;border-radius:6px;padding:7px 11px;text-decoration:none;cursor:pointer}button:disabled,.actions a[aria-disabled=true]{opacity:.45;pointer-events:none}.actions .primary{background:#204c8e;color:white;border-color:#204c8e}.hint{font-size:12px;color:#66778e;padding:8px 22px;line-height:1.6;background:white;border-bottom:1px solid #dae2ec}.workspace{position:relative;flex:1;min-height:0;background:#e8ecf1}iframe{border:0;width:100%;height:100%;display:block}iframe[hidden]{display:none}.loading{position:absolute;inset:0;display:grid;place-items:center;background:#f4f6fa;color:#718199;pointer-events:none}.loading[hidden]{display:none}footer{padding:6px 22px;display:flex;justify-content:space-between;background:white;color:#7a8798;font-size:11px}footer a{color:inherit}@media(max-width:760px){header{gap:12px;padding:10px 12px;flex-wrap:wrap}.version{display:none}h1{font-size:15px}.tabs a{padding:7px 13px}.toolbar{padding:9px 12px}.filename{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.actions{margin-left:0;gap:7px}.hint{padding:7px 12px}footer{padding:6px 12px}}
  </style>
</head>
<body>
  <header><h1>Word / PDF 统一批注</h1><nav class="tabs" aria-label="文件类型"><a href="?app=word" data-app="word">Word 批阅</a><a href="?app=pdf" data-app="pdf">PDF 批阅</a></nav><span class="version" id="version"></span></header>
  <section class="toolbar"><span class="filename" id="filename">RFQ-review-example.docx</span><span id="status" role="status">正在加载编辑器…</span><div class="actions"><button id="open-file">打开文件</button><input id="file-picker" type="file" hidden><button id="reopen" disabled>重开已保存稿</button><a id="download" class="primary" aria-disabled="true">下载最新批阅稿</a></div></section>
  <div class="hint" id="hint"></div>
  <div id="review-tools" class="word-classic-document review-tools"><div class="wc-tools" aria-label="文档批注工具栏"><span class="wc-file">页边批注 · <span data-count>0 条批注</span></span><button type="button" class="wc-button" data-new disabled><i data-icon="message-square-plus"></i>新建批注</button><button type="button" class="wc-button" data-previous aria-label="上一条批注" disabled><i data-icon="chevron-up"></i></button><button type="button" class="wc-button" data-next aria-label="下一条批注" disabled><i data-icon="chevron-down"></i></button><button type="button" class="wc-button" data-format aria-pressed="true" aria-label="显示编辑标记" disabled>¶</button></div></div>
  <main class="workspace"><iframe id="word-frame" title="WordCraft Word 批阅编辑器" hidden allow="fullscreen; clipboard-read; clipboard-write"></iframe><iframe id="pdf-frame" title="PdfCraft PDF 批阅编辑器" hidden allow="fullscreen; clipboard-read; clipboard-write"></iframe><div id="original-comments" class="word-classic-document original-comments" aria-label="原版 Word 页边批注"><div data-native-clip><div data-native-margins></div><svg data-native-highlights aria-hidden="true"></svg><aside class="wc-margin" data-margin aria-label="与正文对应的页边批注"></aside><svg class="wc-connectors" data-connectors role="img" aria-label="原文与页边批注之间的彩色连接线"></svg><div class="wc-floating" data-floating hidden><button type="button" class="wc-button" data-new><i data-icon="message-square-plus"></i>新建批注</button></div></div></div><div id="loading" class="loading">正在启动浏览器编辑器，首次加载需要一些时间…</div></main>
  <footer><span id="footer-text"></span><span><a href="https://github.com/storytold/wordcraft" target="_blank" rel="noreferrer">WordCraft</a> · <a href="https://github.com/storytold/pdfcraft" target="_blank" rel="noreferrer">PdfCraft</a></span></footer>
  <script type="module" src="/classic-demo.js"></script>
</body>
</html>
