services:
  rfq-service:
    image: rfq-service:onlyoffice
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: "${SPRING_PROFILES_ACTIVE:-prod}"
      SERVER_PORT: "48081"
      JAVA_TOOL_OPTIONS: "${JAVA_TOOL_OPTIONS:-}"
      RFQ_STORAGE_DIR: /app/data/rfq-files
      RFQ_STORAGE_TYPE: "${RFQ_STORAGE_TYPE:-local}"
      RFQ_MINIO_ENDPOINT: "${RFQ_MINIO_ENDPOINT:-}"
      RFQ_MINIO_BUCKET: "${RFQ_MINIO_BUCKET:-rfq-files}"
      RFQ_MINIO_ACCESS_KEY: "${RFQ_MINIO_ACCESS_KEY:-}"
      RFQ_MINIO_SECRET_KEY: "${RFQ_MINIO_SECRET_KEY:-}"
      RFQ_DB_URL: "${RFQ_DB_URL:-jdbc:mysql://host.docker.internal:3306/rfq?useUnicode=true&characterEncoding=utf8&allowPublicKeyRetrieval=true&useSSL=false}"
      RFQ_DB_USER: "${RFQ_DB_USER:-rfq_app}"
      RFQ_DB_PASSWORD: "${RFQ_DB_PASSWORD:-rfq_app_pwd}"
      RFQ_JWT_SECRET: "${RFQ_JWT_SECRET:-rfq-local-dev-secret-key-please-replace-in-production}"
      RFQ_LLM_ENABLED: "${RFQ_LLM_ENABLED:-false}"
      RFQ_HISTORY_RULES_ENABLED: "${RFQ_HISTORY_RULES_ENABLED:-true}"
      RFQ_HISTORY_LLM_ENABLED: "${RFQ_HISTORY_LLM_ENABLED:-${RFQ_LLM_ENABLED:-false}}"
      RFQ_LLM_URL: "${RFQ_LLM_URL:-}"
      RFQ_LLM_API_KEY: "${RFQ_LLM_API_KEY:-}"
      RFQ_LLM_MODEL: "${RFQ_LLM_MODEL:-}"
      RFQ_LLM_LOG_PAYLOAD: "${RFQ_LLM_LOG_PAYLOAD:-false}"
      RFQ_LLM_CONNECT_TIMEOUT: "${RFQ_LLM_CONNECT_TIMEOUT:-3s}"
      RFQ_LLM_TIMEOUT: "${RFQ_LLM_TIMEOUT:-30s}"
      RFQ_LLM_BATCH_CHARS: "${RFQ_LLM_BATCH_CHARS:-16000}"
      RFQ_LLM_BATCH_BLOCKS: "${RFQ_LLM_BATCH_BLOCKS:-20}"
      RFQ_MARKITDOWN_TIMEOUT: "${RFQ_MARKITDOWN_TIMEOUT:-60s}"
      RFQ_WORD_MARKDOWN_MAX_CHARS: "${RFQ_WORD_MARKDOWN_MAX_CHARS:-100000}"
      RFQ_OCR_ENABLED: "${RFQ_OCR_ENABLED:-false}"
      RFQ_OCR_URL: "${RFQ_OCR_URL:-}"
      RFQ_OCR_API_KEY: "${RFQ_OCR_API_KEY:-}"
      RFQ_OCR_CONNECT_TIMEOUT: "${RFQ_OCR_CONNECT_TIMEOUT:-3s}"
      RFQ_OCR_TIMEOUT: "${RFQ_OCR_TIMEOUT:-30s}"
      RFQ_OCR_MAX_IMAGES: "${RFQ_OCR_MAX_IMAGES:-100}"
      RFQ_OCR_MAX_IMAGE_PIXELS: "${RFQ_OCR_MAX_IMAGE_PIXELS:-20000000}"
      RFQ_OCR_MAX_IMAGE_BYTES: "${RFQ_OCR_MAX_IMAGE_BYTES:-10485760}"
      RFQ_MINERU_ENABLED: "${RFQ_MINERU_ENABLED:-false}"
      RFQ_MINERU_URL: "${RFQ_MINERU_URL:-}"
      RFQ_MINERU_API_KEY: "${RFQ_MINERU_API_KEY:-}"
      RFQ_MINERU_BACKEND: "${RFQ_MINERU_BACKEND:-pipeline}"
      RFQ_MINERU_CONNECT_TIMEOUT: "${RFQ_MINERU_CONNECT_TIMEOUT:-3s}"
      RFQ_MINERU_TIMEOUT: "${RFQ_MINERU_TIMEOUT:-120s}"
      ONLYOFFICE_PUBLIC_URL: "${ONLYOFFICE_PUBLIC_URL:-http://127.0.0.1:8082}"
      ONLYOFFICE_INTERNAL_URL: "${ONLYOFFICE_INTERNAL_URL:-http://onlyoffice}"
      ONLYOFFICE_CALLBACK_BASE_URL: "http://rfq-service:48081"
      ONLYOFFICE_JWT_SECRET: "${ONLYOFFICE_JWT_SECRET:-}"
      ONLYOFFICE_STORAGE_DIR: /app/data/onlyoffice
      ONLYOFFICE_FRONTEND_ORIGINS: "${ONLYOFFICE_FRONTEND_ORIGINS:-http://127.0.0.1:5173,http://localhost:5173}"
    volumes:
      - office-documents:/app/data
    ports:
      - "127.0.0.1:${RFQ_HOST_PORT:-48081}:48081"
    restart: unless-stopped
    stop_grace_period: 35s
    logging:
      driver: local
      options:
        max-size: "20m"
        max-file: "5"
  onlyoffice:
    image: onlyoffice/documentserver:9.3.1.2
    profiles: [office]
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: "${ONLYOFFICE_JWT_SECRET:-}"
      ALLOW_PRIVATE_IP_ADDRESS: "true"
    ports:
      - "127.0.0.1:${ONLYOFFICE_HOST_PORT:-8082}:80"
    volumes:
      - office-cache:/var/lib/onlyoffice
      - office-data:/var/www/onlyoffice/Data
      - office-db:/var/lib/postgresql
    restart: unless-stopped
volumes:
  office-documents:
  office-cache:
  office-data:
  office-db:
