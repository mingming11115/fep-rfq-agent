# /etc/nginx/conf.d/rfq.conf
#
# 由 deploy/https/setup-https.sh 安装并替换 __PLACEHOLDER__。
# 也可手工复制后自行替换占位符，再执行 nginx -t && nginx -s reload。
#
# 占位符：
#   __SERVER_NAME__  访问地址（IP 或域名）
#   __WEB_ROOT__     前端静态产物目录
#   __CERT__         证书路径
#   __KEY__          私钥路径
#   __CHAIN__        证书链路径（企业 CA 才需要，自签留空并删除对应行）
#   __API_PORT__     业务后端端口（/api/rfq、/api/craft）
#   __OFFICE_PORT__  文档服务端口（/api/office）

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name __SERVER_NAME__;

    # 保留 ACME 校验通道，将来换正式证书时不用改这里
    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    # nginx 1.25.1 以下不支持 `http2 on;`，需要 HTTP/2 时改成 listen 443 ssl http2;
    server_name __SERVER_NAME__;

    ssl_certificate     __CERT__;
    ssl_certificate_key __KEY__;
    ssl_trusted_certificate __CHAIN__;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:rfq_ssl:10m;
    ssl_session_timeout 10m;

    root  __WEB_ROOT__;
    index index.html;

    # 后端单文件 30MB、整请求 64MB（application.yml 的 multipart 配置）。
    # nginx 默认只有 1MB，这里不放开上传会直接 413。
    client_max_body_size 64m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    # ^~ 是必须的：否则下面的静态资源正则 location 会抢走带扩展名的接口路径
    location ^~ /api/rfq/ {
        proxy_pass http://127.0.0.1:__API_PORT__;
        include /etc/nginx/rfq-proxy.conf;
    }

    location ^~ /api/craft/ {
        proxy_pass http://127.0.0.1:__API_PORT__;
        include /etc/nginx/rfq-proxy.conf;
    }

    location ^~ /api/office/ {
        proxy_pass http://127.0.0.1:__OFFICE_PORT__;
        include /etc/nginx/rfq-proxy.conf;
    }

    location ~* \.(js|css|woff2?|ttf|otf|png|jpg|jpeg|gif|svg|ico|wasm|pdf)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location / {
        # index.html 不缓存，避免升级后客户端仍加载旧版本引用的资源
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
