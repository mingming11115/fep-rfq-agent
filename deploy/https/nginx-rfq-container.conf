# Host nginx terminates HTTPS; all application content comes from rfq-web.
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name __SERVER_NAME__;
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name __SERVER_NAME__;
    ssl_certificate __CERT__;
    ssl_certificate_key __KEY__;
    ssl_trusted_certificate __CHAIN__;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:rfq_ssl:10m;
    ssl_session_timeout 10m;
    client_max_body_size 64m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    # No static resource regex here: JS, WASM, SPA routes and API requests
    # must all reach the same release in the web container.
    location / {
        proxy_pass http://127.0.0.1:__WEB_PORT__;
        include /etc/nginx/rfq-proxy.conf;
    }
}
