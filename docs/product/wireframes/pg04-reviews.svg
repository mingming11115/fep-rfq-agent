<text xmlns="http://www.w3.org/2000/svg" x="786" y="630" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#1d2129">影响：测试排期需确认；成本和交期由责任人补充。</text>

