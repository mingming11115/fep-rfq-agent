<text xmlns="http://www.w3.org/2000/svg" x="276" y="446" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="22" font-weight="400" fill="#1d2129" />

<text xmlns="http://www.w3.org/2000/svg" x="276" y="485" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="22" font-weight="400" fill="#1d2129">2.1 加工厚度</text>

