<text xmlns="http://www.w3.org/2000/svg" x="1114" y="305" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#1d2129">通过：已解析要求已纳入草稿</text>

<text xmlns="http://www.w3.org/2000/svg" x="1114" y="356" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#1d2129">! 3 条要求尚待确认</text>

<text xmlns="http://www.w3.org/2000/svg" x="1114" y="407" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#1d2129">! 1 项偏离尚未关闭</text>

<text xmlns="http://www.w3.org/2000/svg" x="1114" y="458" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#1d2129">通过：模板字段已映射</text>

<text xmlns="http://www.w3.org/2000/svg" x="1114" y="509" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#1d2129">通过：内部信息按对外模板排除</text>

<rect xmlns="http://www.w3.org/2000/svg" x="1114" y="587" width="512" height="152" rx="8" fill="#edf3ff" stroke="#e5e7eb" />

<text xmlns="http://www.w3.org/2000/svg" x="1134" y="630" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#1d2129">点击缺项可跳回对应条目。</text>

<text xmlns="http://www.w3.org/2000/svg" x="1134" y="668" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#1d2129">修复全部阻断项后，才可提交审批。</text>

<text xmlns="http://www.w3.org/2000/svg" x="1134" y="706" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#1d2129">批准绑定指定版本，修改后需复核。</text>

