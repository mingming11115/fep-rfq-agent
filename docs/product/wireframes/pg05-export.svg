<text xmlns="http://www.w3.org/2000/svg" x="276" y="563" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="22" font-weight="400" fill="#1d2129" />

<text xmlns="http://www.w3.org/2000/svg" x="276" y="602" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="22" font-weight="400" fill="#1d2129">2.2 切缝宽度</text>

<text xmlns="http://www.w3.org/2000/svg" x="276" y="641" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="22" font-weight="400" fill="#1d2129">[待确认] 指标口径需专业评审。</text>

<text xmlns="http://www.w3.org/2000/svg" x="276" y="680" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="22" font-weight="400" fill="#1d2129" />

<text xmlns="http://www.w3.org/2000/svg" x="276" y="719" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="22" font-weight="400" fill="#1d2129">2.3 设备配置</text>

<text xmlns="http://www.w3.org/2000/svg" x="276" y="758" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="22" font-weight="400" fill="#1d2129">[条件待确认] 需要选配模块，待内部确认。</text>

<text xmlns="http://www.w3.org/2000/svg" x="250" y="943" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#64748b">最终文件默认不带历史项目名称、内部成本或评审批注。</text>

