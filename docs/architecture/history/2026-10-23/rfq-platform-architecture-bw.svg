<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1380" viewBox="0 0 1600 1380" role="img" aria-labelledby="title desc">
<title id="title">RFQ 平台目标技术架构：企业内网部署</title>
<desc id="desc">Web 工作台通过统一入口访问模块化业务后端。后端负责项目、应答、批注、任务、评审、知识、版本和批准快照，向异步队列提交文档、比对、索引和导出任务。文档 Worker 处理原 Word、结构锚点、OCR 与模板导出；智能 Worker 按标准回复、历史 RFQ、机型能力顺序检索，使用本地模型生成建议并保留引用。业务数据库、文件存储与可重建知识索引位于内网，权限、审计及批准快照控制整个流程。这是目标架构，当前代码仍为交互原型。</desc>
<defs>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#444444"/></marker>
  <marker id="asyncArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#444444"/></marker>
  <style>
    text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;fill:#111111;font-size:20px}
    .title{font-size:38px;font-weight:600;letter-spacing:1px}.subtitle{font-size:21px;fill:#555555}.boundary{font-size:19px;font-weight:500;fill:#333333}.heading{font-size:24px;font-weight:600}.body{font-size:20px;fill:#333333}.small{font-size:18px;fill:#555555}.chip{font-size:19px;font-weight:500}.tag{font-size:17px;font-weight:500;fill:#444444}.wire{fill:none;stroke:#444444;stroke-width:2;stroke-linejoin:round;marker-end:url(#arrow)}.asyncWire{fill:none;stroke:#444444;stroke-width:2.3;stroke-dasharray:8 6;stroke-linejoin:round;marker-end:url(#asyncArrow)}.wireLabel{font-size:17px;fill:#444444}.policy{font-size:19px;fill:#333333}
  </style>
</defs>
