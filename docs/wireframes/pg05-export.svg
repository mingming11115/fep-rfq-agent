<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1120" viewBox="0 0 1680 1120"><title>草稿、审核与导出</title><rect width="1680" height="1120" fill="#f4f6f8"/>
<rect x="0" y="0" width="1680" height="76" rx="0" fill="#ffffff" stroke="#ffffff"/>
<text x="26" y="50" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="26" font-weight="600" fill="#243042">FEP  RFQ 工作台</text>
<text x="1120" y="48" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#64748b">内网系统  /  内部人员使用</text>
<rect x="0" y="78" width="184" height="1042" rx="0" fill="#e9edf2" stroke="#e9edf2"/>
<text x="28" y="143" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#243042">项目列表</text>
<text x="28" y="211" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#243042">资料与解析</text>
<text x="28" y="279" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#243042">逐条应答</text>
<text x="28" y="347" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#243042">评审与偏离</text>
<rect x="14" y="382" width="156" height="50" rx="5" fill="#ffffff" stroke="#cbd5e1"/>
<text x="28" y="415" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="21" font-weight="600" fill="#254f87">草稿与导出</text>
<text x="28" y="483" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#243042">知识与结果</text>
<text x="220" y="140" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="30" font-weight="600" fill="#243042">PG-05  草稿、审核与导出</text>
<text x="220" y="179" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#64748b">示例为仍有待处理条目的项目：可导出内部草稿，不能提交定稿审批或正式导出。</text>
<text x="220" y="1098" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#64748b">低保真页面示意 · 全部为模拟数据 · 用于明确布局与交互，非已实现系统</text>
<rect x="220" y="210" width="850" height="810" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
<text x="240" y="253" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="23" font-weight="600" fill="#243042">应答草稿预览 / 工作版本 1</text>
<rect x="244" y="279" width="330" height="44" rx="5" fill="#ffffff" stroke="#cbd5e1"/>
<text x="258" y="308" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#243042">模板：内置应答模板 v</text>
<rect x="250" y="355" width="790" height="525" rx="8" fill="#fafafa" stroke="#cbd5e1"/>
<text x="276" y="407" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="22" font-weight="400" fill="#243042">RFQ-001  技术应答（内部草稿）</text>
<text x="276" y="446" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="22" font-weight="400" fill="#243042"></text>
<text x="276" y="485" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="22" font-weight="400" fill="#243042">2.1 加工厚度</text>
<text x="276" y="524" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="22" font-weight="400" fill="#243042">Comply。所选配置支持加工 1.2 mm 厚硅晶圆。</text>
<text x="276" y="563" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="22" font-weight="400" fill="#243042"></text>
<text x="276" y="602" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="22" font-weight="400" fill="#243042">2.2 切缝宽度</text>
<text x="276" y="641" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="22" font-weight="400" fill="#243042">[待确认] 指标口径需专业评审。</text>
<text x="276" y="680" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="22" font-weight="400" fill="#243042"></text>
<text x="276" y="719" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="22" font-weight="400" fill="#243042">2.3 设备配置</text>
<text x="276" y="758" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="22" font-weight="400" fill="#243042">[条件待确认] 需要选配模块，待内部确认。</text>
<text x="250" y="943" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#64748b">最终文件默认不带历史项目名称、内部成本或评审批注。</text>
<rect x="1090" y="210" width="560" height="810" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
<text x="1110" y="253" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="23" font-weight="600" fill="#243042">提交审批前检查</text>
<text x="1114" y="305" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#243042">通过：已解析要求已纳入草稿</text>
<text x="1114" y="356" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#243042">! 3 条要求尚待确认</text>
<text x="1114" y="407" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#243042">! 1 项偏离尚未关闭</text>
<text x="1114" y="458" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#243042">通过：模板字段已映射</text>
<text x="1114" y="509" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#243042">通过：内部信息按对外模板排除</text>
<rect x="1114" y="587" width="512" height="152" rx="8" fill="#eef4fb" stroke="#cbd5e1"/>
<text x="1134" y="630" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#243042">点击缺项可跳回对应条目。</text>
<text x="1134" y="668" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#243042">修复全部阻断项后，才可提交审批。</text>
<text x="1134" y="706" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#243042">批准绑定指定版本，修改后需复核。</text>
<rect x="1114" y="789" width="250" height="44" rx="5" fill="#254f87" stroke="#254f87"/>
<text x="1128" y="818" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#ffffff">导出内部草稿</text>
<rect x="1114" y="851" width="310" height="44" rx="5" fill="#e5e7eb" stroke="#e5e7eb"/>
<text x="1128" y="880" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#7d8794">提交审批（不可用）</text>
<rect x="1114" y="913" width="310" height="44" rx="5" fill="#e5e7eb" stroke="#e5e7eb"/>
<text x="1128" y="942" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#7d8794">正式导出（未批准）</text></svg>
